name: Build Android module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Compile Java and DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes build/module
          mapfile -t sources < <(find src/main/java -name '*.java' -print)
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d build/classes "${sources[@]}"
          mapfile -t classes < <(find build/classes -name '*.class' -print)
          "$ANDROID_HOME/build-tools/35.0.1/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output build/module "${classes[@]}"
          test -s build/module/classes.dex
          sha256sum build/module/classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: capture-module-dex
          path: build/module/classes.dex
  settings-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build unsigned settings APK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          bt="$sdk/build-tools/35.0.1"
          jar="$sdk/platforms/android-35/android.jar"
          mkdir -p settings-app/build/classes settings-app/build/dex
          javac -source 8 -target 8 -Xlint:-options -cp "$jar" -d settings-app/build/classes settings-app/src/id/eujian/capture/settings/SettingsActivity.java
          mapfile -t classes < <(find settings-app/build/classes -name '*.class' -print)
          "$bt/d8" --min-api 29 --lib "$jar" --output settings-app/build/dex "${classes[@]}"
          "$bt/aapt2" link --manifest settings-app/AndroidManifest.xml -I "$jar" --min-sdk-version 29 --target-sdk-version 35 -o settings-app/build/unsigned.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('settings-app/build/unsigned.apk', 'a', zipfile.ZIP_DEFLATED) as z:
              z.write('settings-app/build/dex/classes.dex', 'classes.dex')
          PY
          test -s settings-app/build/unsigned.apk
          sha256sum settings-app/build/unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: settings-app-unsigned-apk
          path: settings-app/build/unsigned.apk
