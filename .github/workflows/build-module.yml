name: Build Android module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Compile Java and DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes build/module
          mapfile -t sources < <(find src/main/java -name '*.java' -print)
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d build/classes "${sources[@]}"
          mapfile -t classes < <(find build/classes -name '*.class' -print)
          "$ANDROID_HOME/build-tools/35.0.1/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output build/module "${classes[@]}"
          test -s build/module/classes.dex
          sha256sum build/module/classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: capture-module-dex
          path: build/module/classes.dex
